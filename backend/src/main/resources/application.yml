spring:
  application:
    name: taskflow
  datasource:
    # Defaults to an in-memory H2 database so the app runs with zero setup.
    # Override these with environment variables to use PostgreSQL.
    url: ${DATABASE_URL:jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update

taskflow:
  jwt:
    # Must be at least 32 characters. Set JWT_SECRET to your own value outside local development.
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-32chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  seed-demo: ${SEED_DEMO:true}
